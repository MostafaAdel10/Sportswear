name: Sportswear CI/CD

on:
  push:
    branches: ["master"]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Test
        run: dotnet test --no-build

      - name: Publish
        run: dotnet publish -c Release -o publish

      # 🐳 Docker
      - name: Build Docker Image
        run: docker build -t sportswear-api -f Sportswear.Api/Dockerfile .

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Tag Image
        run: docker tag sportswear-api mostafaadel1998/sportswear-api:latest

      - name: Push Image
        run: docker push mostafaadel1998/sportswear-api:latest
